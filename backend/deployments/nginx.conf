server {
    server_name backend-fastapi-template.com;

    location / {
        proxy_pass http://127.0.0.1:10000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    listen 443 ssl;
    ssl_certificate            /<ssl-path>/project-com.pem;
    ssl_certificate_key        /<ssl-path>/project-com.key;

    client_max_body_size    15M;

    proxy_read_timeout      600;
    proxy_connect_timeout   600;
    proxy_send_timeout      600;
    client_body_timeout     600;
    client_header_timeout   600;
    keepalive_timeout       600;

    access_log  /var/log/nginx/backend-fastapi-template/access.log;
    error_log   /var/log/nginx/backend-fastapi-template/error.log;
}

server {
    if ($host = backend-fastapi-template.com) {
        return 301 https://$host$request_uri;
    }

    server_name backend-fastapi-template.com;

    listen 80;
    return 404;
}